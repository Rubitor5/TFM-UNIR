name: Semgrep SAST

on:
  workflow_call:
    inputs:
      working-dir:
        type: string
        default: project-microservice

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        working-directory: ${{ inputs.working-dir }}
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: ${{ inputs.working-dir }}/semgrep-results.json