name: Semgrep SAST

on:
  workflow_call:
    inputs:
      working-dir:
        type: string
        default: project-microservice

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        working-directory: ${{ inputs.working-dir }}
        run: semgrep scan --config auto --error