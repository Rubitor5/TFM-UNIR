name: AI Security Triage

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ai-triage:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      BEDROCK_MODEL_ID: arn:aws:bedrock:eu-north-1:100002492253:inference-profile/eu.anthropic.claude-sonnet-4-5-20250929-v1:0

    steps:
      - uses: actions/checkout@v4

      # =========================
      # DOWNLOAD SCANNER RESULTS
      # =========================
      - name: Download Semgrep Results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: artifacts/

      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: artifacts/

      - name: Download Sonar Results
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-results
          path: artifacts/

      # =========================
      # AWS AUTH
      # =========================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::100002492253:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # =========================
      # PYTHON SETUP
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # =========================
      # NORMALIZATION
      # =========================
      - name: Normalize Findings
        run: |
          python ai-triaging/normalizers/main.py \
            --semgrep artifacts/semgrep-results.json \
            --trivy artifacts/trivy-results.json \
            --sonarqube artifacts/sonarqube-results.json \
            --output normalized-findings.json

      # =========================
      # DEBUG NORMALIZED OUTPUT
      # =========================
      - name: Debug normalized findings
        run: |
          echo "=== normalized-findings.json ==="
          cat normalized-findings.json || echo "FILE MISSING"

      # =========================
      # VALIDATE NORMALIZED OUTPUT
      # =========================
      - name: Validate normalized output
        run: |
          python - << 'EOF'
          import json

          with open("normalized-findings.json") as f:
              content = f.read().strip()

          if not content:
              raise Exception("normalized-findings.json is EMPTY")

          obj = json.loads(content)

          if "findings" not in obj:
              raise Exception("Invalid schema: missing 'findings'")

          print("OK: normalized findings valid")
          EOF

      # =========================
      # BEDROCK INVOCATION
      # =========================
      - name: Invoke Bedrock AI Triage
        run: |
          python ai-triaging/bedrock/invoke_bedrock.py \
            --input normalized-findings.json \
            --output ai-results.json

      # =========================
      # DEBUG AI OUTPUT (CRITICAL)
      # =========================
      - name: Debug AI results
        run: |
          echo "=== ai-results.json ==="
          cat ai-results.json || echo "FILE MISSING OR EMPTY"

      # =========================
      # UPLOAD AI RESULTS (IMPORTANT)
      # =========================
      - name: Upload AI Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-results
          path: ai-results.json

  # =========================
  # VERDICT JOB (separate stage)
  # =========================
  verdict:
    runs-on: ubuntu-latest
    needs: ai-triage

    steps:
      - uses: actions/checkout@v4

      # =========================
      # DOWNLOAD AI RESULTS
      # =========================
      - name: Download AI Results
        uses: actions/download-artifact@v4
        with:
          name: ai-results
          path: artifacts/

      # =========================
      # DEBUG DOWNLOADED FILE
      # =========================
      - name: Debug AI Results (post-download)
        run: |
          echo "=== downloaded ai-results.json ==="
          cat artifacts/ai-results.json || echo "MISSING FILE"

      # =========================
      # VERDICT ENGINE
      # =========================
      - name: Evaluate Verdict
        run: |
          python ai-triaging/policy/verdict_engine.py artifacts/ai-results.json

      # =========================
      # PR COMMENT
      # =========================
      - name: Post PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python ai-triaging/github/pr_comment.py artifacts/ai-results.json