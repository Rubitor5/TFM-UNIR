name: Qodana code quality

on:
  workflow_call:
    inputs:
      working_dir:
        type: string
        required: false
        default: project-microservice

      java_version:
        type: string
        required: false
        default: '11'

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run Qodana
        uses: jetbrains/qodana-action@v2024.3
        with:
          project-dir: ${{ inputs.working_dir }}
          linter: jetbrains/qodana-jvm-community:2024.3
          fail-threshold: 0
          upload-results: true
          use-caches: true