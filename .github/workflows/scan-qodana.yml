name: Qodana code quality

on:
  workflow_call:
    inputs:
      working_dir:
        type: string
        required: false
        default: project-microservice

      java_version:
        type: string
        required: false
        default: '11'

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Resolve Maven dependencies
        run: |
          mvn -B -ntp dependency:go-offline \
            -f ${{ inputs.working_dir }}/pom.xml

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          use-caches: true
          upload-result: true

          args: >
            --project-dir=${{ inputs.working_dir }}
            --linter=jetbrains/qodana-jvm-community:2026.1
            --fail-threshold=0

        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1339069886 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_RAM: 4096