name: CI/CD Pipeline

on:
  pull_request:

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy (required for manual runs)"
        required: true
        type: string

      image_tag:
        description: "Image tag (optional override)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/build-test.yml

  semgrep:
    name: Semgrep SAST
    needs: build-test
    uses: ./.github/workflows/scan-semgrep.yml

  trivy:
    name: Trivy scan
    if: false # Temporarily disable Trivy scan to avoid build failures due to new vulnerabilities
    needs: build-test
    uses: ./.github/workflows/scan-trivy.yml

  sonarqube:
    name: SonarQube code quality
    needs: build-test
    uses: ./.github/workflows/scan-sonarqube.yml
    secrets: inherit

  ai-security-triage:
    name: AI Security Triage
    if: false # Temporarily disable AI triage to avoid blocking PRs due to new vulnerabilities until we have a better process in place
    needs:
      - semgrep
      - trivy
      - sonarqube
    uses: ./.github/workflows/ai-triaging.yml
    secrets: inherit

  build-image:
    name: Build Image
    needs:
      - build-test
    uses: ./.github/workflows/build-image.yml
    secrets: inherit

  deploy-preview:
    name: Deploy Preview
    needs: build-image
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}
      image_tag: ${{ needs.build-image.outputs.image_tag }}

  e2e-verification:
    name: E2E Verification
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/verify-e2e.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}

  auto-cleanup:
    name: Auto Cleanup on Success
    needs: e2e-verification
    if: github.event_name == 'pull_request' && success()
    uses: ./.github/workflows/cleanup-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}

  cleanup-preview:
    name: Cleanup Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/cleanup-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}