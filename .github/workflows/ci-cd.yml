name: CI/CD Pipeline

on:
  pull_request:

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy (required for manual runs)"
        required: true
        type: string

      image_tag:
        description: "Image tag (optional override)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/build-test.yml

  semgrep:
    name: Semgrep SAST
    needs: build-test
    uses: ./.github/workflows/scan-semgrep.yml

  trivy:
    name: Trivy scan
    needs: build-test
    uses: ./.github/workflows/scan-trivy.yml

  sonarqube:
    name: SonarQube code quality
    needs: build-test
    uses: ./.github/workflows/scan-sonarqube.yml
    secrets: inherit

  ai-security-triage:
    name: AI Security Triage
    needs:
      - semgrep
      - trivy
      - sonarqube
    uses: ./.github/workflows/ai-triaging.yml
    secrets: inherit

  build-image:
    name: Build Image
    needs:
      - build-test
      - ai-security-triage
    uses: ./.github/workflows/build-image.yml
    secrets: inherit

  deploy-preview:
    name: Deploy Preview
    needs: build-image
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}
      image_tag: ${{ needs.build-image.outputs.image_tag }}

  e2e-verification:
    name: E2E Verification
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::100002492253:role/github-actions-role
          aws-region: eu-north-1

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region eu-north-1 --name tfm-unir-eks

      - name: Wait for E2E Job Completion
        run: |
          PR_NUM="${{ github.event.number }}"
          NAMESPACE="pr-${PR_NUM}"
          
          echo "Waiting for ArgoCD to sync and create the E2E test job in namespace ${NAMESPACE}..."
          
          # Poll up to 10 minutes (60 * 10s) for Job creation
          JOB_CREATED=false
          for i in {1..60}; do
            if kubectl -n ${NAMESPACE} get job project-microservice-e2e-test-job >/dev/null 2>&1; then
              echo "E2E Job detected!"
              JOB_CREATED=true
              break
            fi
            sleep 10
          done
          
          if [ "$JOB_CREATED" = "false" ]; then
            echo "Timeout waiting for ArgoCD to deploy the E2E Job."
            exit 1
          fi
          
          echo "Monitoring E2E Job execution..."
          # Poll up to 10 minutes (60 * 10s) for completion status
          for i in {1..60}; do
            STATUS=$(kubectl -n ${NAMESPACE} get job project-microservice-e2e-test-job -o jsonpath='{.status.conditions[0].type}' 2>/dev/null)
            if [ "$STATUS" = "Complete" ]; then
              echo "E2E tests passed successfully!"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "E2E tests failed! Check pod logs:"
              kubectl -n ${NAMESPACE} logs -l app=project-microservice-e2e --tail=100
              exit 1
            fi
            echo "Job still running... (current status: $STATUS)"
            sleep 10
          done
          
          echo "Timeout waiting for E2E Job to finish."
          exit 1

  auto-cleanup:
    name: Auto Cleanup on Success
    needs: e2e-verification
    if: github.event_name == 'pull_request' && success()
    uses: ./.github/workflows/cleanup-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}

  cleanup-preview:
    name: Cleanup Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/cleanup-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.number }}