name: Trivy scan

on:
  workflow_call:
    inputs:
      scan_ref:
        description: Path to scan
        required: false
        type: string
        default: project-microservice

      severity:
        description: Comma-separated severity levels that fail the build
        required: false
        type: string
        default: CRITICAL,HIGH

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_ref }}
          format: json
          output: trivy-results.json

          scanners: vuln,secret
          ignore-unfixed: true

          exit-code: '1'

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json