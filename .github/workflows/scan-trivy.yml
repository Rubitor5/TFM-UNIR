name: Trivy scan

on:
  workflow_call:
    inputs:
      scan_ref:
        description: Path to scan
        required: false
        type: string
        default: project-microservice

      severity:
        description: Comma-separated severity levels that fail the build
        required: false
        type: string
        default: CRITICAL,HIGH

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_ref }}
          severity: ${{ inputs.severity }}
          exit-code: '1'
          ignore-unfixed: true
          format: table