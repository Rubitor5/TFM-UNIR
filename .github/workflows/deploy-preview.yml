name: Deploy Preview

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: Rubitor5/TFM-UNIR
          token: ${{ secrets.GH_TOKEN }}

      - name: Create manifest
        run: |
          PR=${{ inputs.pr_number }}
          IMAGE_TAG=${{ inputs.image_tag }}

          mkdir -p gitops/preview-envs

          cat > gitops/preview-envs/pr-${PR}.yaml <<EOF
          namespace: pr-${PR}

          image:
            repository: 100002492253.dkr.ecr.eu-north-1.amazonaws.com/project-microservice
            tag: ${IMAGE_TAG}

          host: pr-${PR}.example.com
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gitops/preview-envs/pr-${{ inputs.pr_number }}.yaml
          git commit -m "preview env PR-${{ inputs.pr_number }}" || exit 0
          git push