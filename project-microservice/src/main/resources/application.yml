spring:
  application:
    name: project-microservice
  profiles:
    active: dev

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.mycompany.projectms: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
